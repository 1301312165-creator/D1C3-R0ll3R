<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="diceBox">
        <h1>Dice Roller</h1>
        <div id="diceResults">
            <div class="dieResult">
                <span>Die 1:</span>
                <span id="dice1">?</span>
            </div>
            <div class="dieResult">
                <span>Die 2:</span>
                <span id="dice2">?</span>
            </div>
        </div>
        <div id="total">Click to roll!</div>
    </div>
    <button id="rollButton">Roll Dice</button>
    
    <script src="script.js"></script>
</body>
</html>
